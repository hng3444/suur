<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#126e43" />
    <title>Suur · Çevrimdışı</title>
    <style>
      :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#edf2ec;color:#19211b}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(420px,100%);padding:32px;border:1px solid #dfe5df;border-radius:12px 30px 14px 20px;background:#fff;box-shadow:0 30px 90px rgb(20 51 32/.13)}.mark{width:50px;height:50px;background:#198754;-webkit-mask:url('/suur.svg') center/contain no-repeat;mask:url('/suur.svg') center/contain no-repeat}h1{margin:25px 0 9px;font-family:Georgia,serif;font-size:34px;font-weight:500;letter-spacing:-.04em}p{margin:0;color:#657067;line-height:1.65;font-size:14px}button{width:100%;height:48px;margin-top:25px;border:0;border-radius:8px 15px 9px 12px;background:#126e43;color:#fff;font:700 14px inherit}@media(prefers-color-scheme:dark){:root{background:#0c110d;color:#eef4ef}.card{border-color:#303a32;background:#1a211c}.mark{background:#fff}p{color:#aeb8b0}}
    </style>
  </head>
  <body>
    <main class="card"><div class="mark" aria-hidden="true"></div><h1>Henüz hazır değil.</h1><p>Çevrimdışı kopyayı hazırlamak için Suur'u internete bağlıyken en az bir kez açıp giriş yapmalısın.</p><button onclick="location.reload()">Yeniden dene</button></main>
  </body>
</html>
