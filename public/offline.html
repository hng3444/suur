      :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",sans-serif;background:#f4f5f7;color:#161719}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 14% 5%,#ffe0ca,transparent 31rem),radial-gradient(circle at 92% 92%,#fff0e5,transparent 28rem),#f4f5f7}.card{width:min(420px,100%);padding:34px;border:1px solid rgb(255 255 255/.74);border-radius:34px;background:rgb(255 255 255/.74);box-shadow:0 34px 100px rgb(20 24 32/.16),inset 0 1px 0 rgb(255 255 255/.82);backdrop-filter:blur(28px) saturate(150%)}.mark{display:block;width:76px;height:76px;overflow:visible;border-radius:24%;object-fit:contain;box-shadow:0 10px 26px rgb(188 62 0/.18)}h1{margin:25px 0 9px;font-size:32px;font-weight:750;letter-spacing:-.045em}p{margin:0;color:#737780;line-height:1.65;font-size:15px}button{width:100%;height:52px;margin-top:25px;border:0;border-radius:17px;background:linear-gradient(135deg,#ff6a00,#d94f00);color:#fff;box-shadow:0 10px 26px rgb(255 106 0/.24);font:700 15px inherit}@media(prefers-color-scheme:dark){:root{background:#0b0c0f;color:#f7f7f8}body{background:radial-gradient(circle at 14% 5%,#3a2114,transparent 31rem),#0b0c0f}.card{border-color:rgb(255 255 255/.1);background:rgb(28 30 35/.82)}p{color:#a3a6ae}}

  </body>
