<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#3f5efb" />
    <title>Suur · Çevrimdışı</title>
    <style>
      :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f8fc;color:#111827}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 20% 0,#e5eaff,transparent 32rem)}.card{width:min(420px,100%);padding:34px;border:1px solid #e1e6ef;border-radius:30px;background:#fff;box-shadow:0 28px 80px rgb(27 39 79/.14)}.mark{display:block;width:76px;height:76px;overflow:visible;object-fit:contain}h1{margin:25px 0 9px;font-size:32px;font-weight:750;letter-spacing:-.04em}p{margin:0;color:#667085;line-height:1.65;font-size:15px}button{width:100%;height:52px;margin-top:25px;border:0;border-radius:17px;background:#2948dc;color:#fff;font:700 15px inherit}@media(prefers-color-scheme:dark){:root{background:#0f1117;color:#f5f7ff}.card{border-color:#303643;background:#181b23}p{color:#a7afbf}}
    </style>
  </head>
  <body>
    <main class="card"><img class="mark" src="/suuricon.png" alt="" aria-hidden="true" /><h1>Henüz hazır değil.</h1><p>Çevrimdışı kopyayı hazırlamak için Suur'u internete bağlıyken en az bir kez açıp giriş yapmalısın.</p><button onclick="location.reload()">Yeniden dene</button></main>
  </body>
</html>
