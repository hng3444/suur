<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#f05a24" />
    <title>Suur · Çevrimdışı</title>
    <style>
      :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f2ee;color:#211914}body{min-height:100dvh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box}.card{width:min(420px,100%);padding:32px;border:1px solid #ead9cf;border-radius:12px 30px 14px 20px;background:#fff;box-shadow:0 30px 90px rgb(82 39 18/.13)}.mark{display:block;width:58px;height:58px;border-radius:22%;object-fit:contain}h1{margin:25px 0 9px;font-family:Georgia,serif;font-size:34px;font-weight:500;letter-spacing:-.04em}p{margin:0;color:#74675f;line-height:1.65;font-size:14px}button{width:100%;height:48px;margin-top:25px;border:0;border-radius:8px 15px 9px 12px;background:#c33f0f;color:#fff;font:700 14px inherit}@media(prefers-color-scheme:dark){:root{background:#101112;color:#eef0ef}.card{border-color:#3b332f;background:#1c1a19}p{color:#b8aea8}}
    </style>
  </head>
  <body>
    <main class="card"><img class="mark" src="/suuricon.png" alt="" aria-hidden="true" /><h1>Henüz hazır değil.</h1><p>Çevrimdışı kopyayı hazırlamak için Suur'u internete bağlıyken en az bir kez açıp giriş yapmalısın.</p><button onclick="location.reload()">Yeniden dene</button></main>
  </body>
</html>
