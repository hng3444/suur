services:
  suur:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SUUR_PUBLIC_URL: "${SUUR_PUBLIC_URL:-http://localhost:3721}"
    image: suur:local
    container_name: suur
    init: true
    restart: unless-stopped
    ports:
      - "${SUUR_PORT:-3721}:3000"
    environment:
      DATA_DIR: /data
      MAX_UPLOAD_MB: "${SUUR_MAX_UPLOAD_MB:-25}"
      SUUR_PUBLIC_URL: "${SUUR_PUBLIC_URL:-http://localhost:3721}"
      SUUR_DEFAULT_USERNAME: "${SUUR_DEFAULT_USERNAME:-alaferoce}"
      SUUR_DEFAULT_PASSWORD: "${SUUR_DEFAULT_PASSWORD:-7Admin7}"
      SUUR_FORCE_DEFAULT_PASSWORD_CHANGE: "${SUUR_FORCE_DEFAULT_PASSWORD_CHANGE:-true}"
      SUUR_MAINTENANCE_INTERVAL_MINUTES: "${SUUR_MAINTENANCE_INTERVAL_MINUTES:-60}"
      SUUR_TRUST_PROXY: "${SUUR_TRUST_PROXY:-false}"
      SUUR_ALLOWED_APP_ORIGINS: "${SUUR_ALLOWED_APP_ORIGINS:-}"
      SUUR_ALLOW_INSECURE_MOBILE: "${SUUR_ALLOW_INSECURE_MOBILE:-false}"
      SUUR_NOTE_HISTORY_LIMIT: "${SUUR_NOTE_HISTORY_LIMIT:-100}"
      SUUR_MAX_NOTES_PER_USER: "${SUUR_MAX_NOTES_PER_USER:-50000}"
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - suur-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  suur-data:
    name: "${SUUR_VOLUME_NAME:-suur-data}"
